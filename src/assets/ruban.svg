<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 330 940 330" width="940" height="330" role="img" aria-labelledby="ribbon-title">
    <title id="ribbon-title">Bannière dorée</title>
    <defs>
        <!-- Or du bandeau : reflets verticaux -->
        <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#fff6c8"/>
            <stop offset="0.25" stop-color="#f9de7a"/>
            <stop offset="0.55" stop-color="#e8b830"/>
            <stop offset="0.8"  stop-color="#f7dd7c"/>
            <stop offset="1"    stop-color="#d1a022"/>
        </linearGradient>

        <!-- Éclat diagonal métallique sur le bandeau -->
        <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="164" y1="360" x2="831" y2="500">
            <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.28" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.40" stop-color="#fff" stop-opacity="0.65"/>
            <stop offset="0.48" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.70" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.78" stop-color="#fff" stop-opacity="0.35"/>
            <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
        </linearGradient>

        <!-- Or des queues (gauche / droite) -->
        <linearGradient id="goldTailL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"   stop-color="#f7dc72"/>
            <stop offset="0.5" stop-color="#d9a826"/>
            <stop offset="1"   stop-color="#b17f14"/>
        </linearGradient>
        <linearGradient id="goldTailR" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#f7dc72"/>
            <stop offset="0.5" stop-color="#d9a826"/>
            <stop offset="1"   stop-color="#b17f14"/>
        </linearGradient>

        <!-- Or sombre des plis -->
        <linearGradient id="goldFold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9a6808"/>
            <stop offset="1" stop-color="#c58f18"/>
        </linearGradient>

        <!-- Intérieur du bandeau (pour découper les reflets) -->
        <clipPath id="bandInner"><path d="M164.4,417.4C162.7,448.5 171.3,480.3 178.2,510.4C181.2,523.5 183.6,540.3 192.1,550.9L228.8,538.1C253.2,530.5 278.1,524.1 303.2,519.5C427.1,496.7 558.6,497.7 683.1,515.5C710.3,519.4 737.6,526 763.9,534C777.1,538 790.1,543.7 803.7,546.6C818,523.1 832.1,443.4 830.6,415.5C817.8,404.1 797.2,400.1 781,396.1C746.7,387.7 712,380.3 677,375.5C624,368.2 571,361.8 517.5,361.1L506.4,360.1C461.7,359.7 417.2,362.1 372.7,367C344.8,370 316.8,373.6 289.3,379.4C258.8,385.9 186.5,397.5 164.4,417.4Z"/></clipPath>

        <!-- Ombre portée -->
        <filter id="shadow" x="-8%" y="-20%" width="116%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
        </filter>
    </defs>

    <g filter="url(#shadow)" stroke="#3b2704" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
        <!-- Queues -->
        <path id="queue-gauche" d="M117.5,540.1C115.8,556.4 95.7,580.8 87.4,596C83.7,602.7 76.9,611.7 79.7,619.9C83.9,632.6 116.3,621.2 125.7,618.9C148.6,613.3 171.2,606.7 193.7,600.1C218.3,592.8 242.1,585.8 265.6,575.5C240,567.6 212,566 187.5,555C169.9,522.3 168,484.1 159.9,448.5C135.1,452.4 92.1,468.8 68.9,479.7C60.4,483.6 43.2,491.9 48.1,503.9C51.4,512 61.5,515.1 68.9,518.2C85.3,524.9 102.5,530.5 117.5,540.1Z" fill="url(#goldTailL)"/>
        <path id="queue-droite" d="M732.3,578.6C753.8,587.1 775.2,591.8 797.7,596.8C829.6,603.8 861.6,610.8 894.5,608.2C894.3,588.1 886.6,570.5 878.2,552.6C875.3,546.4 866.8,533 869,526.4C871.1,520 881.7,516.6 887.2,513.7C904,504.9 920.3,497 935.3,485.3C931.7,481.1 928.1,477.1 923.4,474.2C916.1,469.8 907.7,467.6 899.7,464.8C878.5,457.3 857,449.5 834.4,447.5C829.7,472.5 826,497.9 818.8,522.3C816.1,531.6 813.9,544.2 806.1,550.6C795.8,559.3 770.2,563.6 756.8,568C748.4,570.8 740.3,574.6 732.3,578.6Z" fill="url(#goldTailR)"/>
        <!-- Plis -->
        <path id="pli-gauche" d="M268.7,574.8C266.3,561.7 262.7,549.3 258.4,536.7C236.8,539.6 217.1,547.3 197.7,556.9C220.9,565 244.2,571.7 268.7,574.8Z" fill="url(#goldFold)"/>
        <path id="pli-droit"  d="M729.2,576.4C753.2,570.2 776.5,561.9 799.9,554.1C779.7,544.5 759,536.5 736.8,533.5C732.1,547.5 729.5,561.6 729.2,576.4Z" fill="url(#goldFold)"/>
        <!-- Bandeau central -->
        <path id="bandeau" d="M190.1,557.8L228.8,544.4C249.2,537.8 270.2,532.4 291.2,528C419.2,501.3 559.4,502 688.3,522.4C713,526.3 737.4,532.2 761.3,539.5C776.5,544.1 791.1,550 806.7,553.4C826.5,518.3 837.6,453 836.6,412.8C820.3,398.6 799.7,394.5 779.4,389.6C746.4,381.5 713,374.5 679.4,369.8C548.3,351.4 418.2,346.6 287.8,373.6C249.9,381.4 187.9,389.3 158.5,414.6C157.2,446.7 164.4,477.3 171.6,508.4C175.7,526.1 178.4,543.3 190.1,557.8Z" fill="url(#goldBand)"/>
    </g>

    <!-- Reflets du bandeau -->
    <path d="M164.4,417.4C162.7,448.5 171.3,480.3 178.2,510.4C181.2,523.5 183.6,540.3 192.1,550.9L228.8,538.1C253.2,530.5 278.1,524.1 303.2,519.5C427.1,496.7 558.6,497.7 683.1,515.5C710.3,519.4 737.6,526 763.9,534C777.1,538 790.1,543.7 803.7,546.6C818,523.1 832.1,443.4 830.6,415.5C817.8,404.1 797.2,400.1 781,396.1C746.7,387.7 712,380.3 677,375.5C624,368.2 571,361.8 517.5,361.1L506.4,360.1C461.7,359.7 417.2,362.1 372.7,367C344.8,370 316.8,373.6 289.3,379.4C258.8,385.9 186.5,397.5 164.4,417.4Z" fill="url(#shine)" pointer-events="none"/>
    <g clip-path="url(#bandInner)" fill="none" stroke-linecap="round" pointer-events="none">
        <path d="M190.1,557.8L228.8,544.4C249.2,537.8 270.2,532.4 291.2,528C419.2,501.3 559.4,502 688.3,522.4C713,526.3 737.4,532.2 761.3,539.5C776.5,544.1 791.1,550 806.7,553.4C826.5,518.3 837.6,453 836.6,412.8C820.3,398.6 799.7,394.5 779.4,389.6C746.4,381.5 713,374.5 679.4,369.8C548.3,351.4 418.2,346.6 287.8,373.6C249.9,381.4 187.9,389.3 158.5,414.6C157.2,446.7 164.4,477.3 171.6,508.4C175.7,526.1 178.4,543.3 190.1,557.8Z" transform="translate(0,13)"  stroke="#fffbe0" stroke-opacity="0.85" stroke-width="3"/>
        <path d="M190.1,557.8L228.8,544.4C249.2,537.8 270.2,532.4 291.2,528C419.2,501.3 559.4,502 688.3,522.4C713,526.3 737.4,532.2 761.3,539.5C776.5,544.1 791.1,550 806.7,553.4C826.5,518.3 837.6,453 836.6,412.8C820.3,398.6 799.7,394.5 779.4,389.6C746.4,381.5 713,374.5 679.4,369.8C548.3,351.4 418.2,346.6 287.8,373.6C249.9,381.4 187.9,389.3 158.5,414.6C157.2,446.7 164.4,477.3 171.6,508.4C175.7,526.1 178.4,543.3 190.1,557.8Z" transform="translate(0,-13)" stroke="#8a5d08" stroke-opacity="0.40" stroke-width="3"/>
    </g>

    <!-- Zone de titre : à remplir en JavaScript -->
    <text id="titre" x="497" y="441"
          text-anchor="middle" dominant-baseline="central"
          font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold"
          fill="#4a2f00" stroke="#fff3b0" stroke-width="0.8" paint-order="stroke"
          data-max-width="590"></text>
</svg>