<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/quizup-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- PWA installée : plein écran, chrome natif minimal (push iOS ≥ 16.4 via écran d'accueil).
         `theme-color` suit le thème RÉSOLU de l'app (pas prefers-color-scheme) : la barre d'état
         Android/Chrome reste alignée même si l'utilisateur force Clair/Sombre. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QuizUp" />
    <!-- Images des questions (seed Wikimedia) : TLS/DNS pré-établis pour le préchargement duel. -->
    <link rel="preconnect" href="https://commons.wikimedia.org" />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <title>QuizUp</title>
    <script>
      // Anti-FOUC : applique le thème persisté AVANT le premier paint (le store Zustand
      // `quizup-theme` n'est hydraté qu'au montage de React). Doit rester synchrone.
      (function () {
        try {
          var raw = localStorage.getItem("quizup-theme");
          var pref = raw ? JSON.parse(raw).state.theme : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
          // Habillage de la nav basse (mobile) : appliqué avant le paint pour éviter un saut.
          var navRaw = localStorage.getItem("quizup-bottom-nav");
          var nav = navRaw ? JSON.parse(navRaw).state.variant : "floating";
          if (nav === "fixed") root.dataset.bottomNav = "fixed";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="qu-root">
    <div id="root"></div>
    <!-- Splash de démarrage : même marque que la coquille (cercle + éclair), thème résolu par
         le script anti-FOUC ci-dessus. Masqué dès que React a monté l'app (`#root` non vide). -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-mark">
        <svg viewBox="0 0 24 24" width="34" height="34">
          <path
            fill="currentColor"
            d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"
          />
        </svg>
      </div>
      <p class="boot-title">QuizUp</p>
      <p class="boot-sub">Duels de culture</p>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #ffffff;
        color: #0a0a0a;
      }
      html.dark #boot-splash {
        background: #0a0a0a;
        color: #fafafa;
      }
      #boot-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: currentColor;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash .boot-mark svg {
        color: #ffffff;
      }
      html.dark #boot-splash .boot-mark svg {
        color: #0a0a0a;
      }
      #boot-splash .boot-title {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        opacity: 0.6;
      }
      #root:not(:empty) ~ #boot-splash {
        display: none;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
